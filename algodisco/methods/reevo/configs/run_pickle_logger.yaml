method:
  template_program_path: "path/to/template.py"
  task_description_path: "path/to/task_description.txt"
  language: "python"
  pop_size: 10
  init_pop_size: auto
  init_trial_multiplier: 10
  selection_mode: "random"
  crossover_operator_weight: 1
  mutation_operator_weight: 1
  mutation_rate: 0.5
  long_term_reflection_window_size: 3
  external_knowledge: ""
  num_samplers: auto
  num_evaluators: auto
  max_samples: 1000
  llm_max_tokens: 1024
  llm_timeout_seconds: 120
  db_save_frequency: 100
  keep_metadata_keys: ["idea", "phase", "operator", "sample_time", "eval_time", "execution_time", "error_msg", "prompt", "response_text", "reflection_guidance", "long_term_reflection", "parent_scores"]
  debug_mode: false
  debug_mode_crash: false

llm:
  class_path: "algodisco.providers.llm.openai_api.OpenAIAPI"
  kwargs:
    model: "gpt-4o-mini"
    api_key: "your-api-key"
    base_url: "https://api.openai.com/v1"

evaluator:
  class_path: "path/to/evaluator.py:YourEvaluator"
  kwargs: {}

logger:
  class_path: "algodisco.providers.logger.pickle_logger.BasePickleLogger"
  kwargs:
    logdir: "logs/reevo_log"
