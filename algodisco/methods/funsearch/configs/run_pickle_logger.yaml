method:

  # Path to the template algorithm source code file, read at runtime as the seed algorithm
  template_program_path: "path/to/template.txt"

  # Path to a natural-language task description file, injected into every LLM prompt
  task_description_path: "path/to/task_description.txt"

  # Programming language of generated algorithms, used to extract code blocks from LLM responses
  language: "python"

  # Number of concurrent sampler threads; "auto" resolves to max(1, cpu_count // 2)
  num_samplers: auto

  # Max concurrent evaluator calls; "auto" resolves to max(1, cpu_count // 4), gated by semaphore
  num_evaluators: auto

  # Whether to use idea-oriented prompting; when true, LLM articulates an improvement idea before writing code
  idea_prompt: false

  # Number of archived example algorithms included in each prompt as context
  examples_per_prompt: 2

  # Number of candidate programs requested from the LLM per single prompt construction
  samples_per_prompt: 4

  # Total number of evaluated candidate samples before the search terminates
  max_samples: 1000

  # Maximum number of tokens the LLM generates in a single response
  llm_max_tokens: null

  # Timeout in seconds for each LLM API call
  llm_timeout_seconds: 120

  # Number of islands (sub-populations) in the program database
  db_num_islands: 10

  # Maximum capacity per island; null means no explicit size cap
  db_max_island_capacity: null

  # Period in seconds for island reset/rebalancing (14400 = 4 hours)
  db_reset_period: 14400

  # Initial temperature for cluster/island sampling; lower is more deterministic (favors better islands)
  db_cluster_sampling_temperature_init: 0.1

  # Annealing period (in samples) for cluster sampling temperature
  db_cluster_sampling_temperature_period: 30000

  # Save a full database snapshot every this many evaluated samples
  db_save_frequency: 100

  # Allowlist of metadata keys retained on each algorithm before serialization for logging
  keep_metadata_keys: ["sample_time", "eval_time", "execution_time", "error_msg", "prompt", "response_text"]

  # Debug mode: when true, sampler thread errors are logged at ERROR level
  debug_mode: false

  # Debug crash mode (requires debug_mode=true): any sampler error terminates the search immediately
  debug_mode_crash: false

llm:

  # Python class path of the LLM provider
  class_path: "algodisco.providers.llm.openai_api.OpenAIAPI"
  kwargs:
    # Model name to use
    model: "gpt-3.5-turbo"

    # API key for authentication
    api_key: "your-api-key"

    # Base URL of the API endpoint
    base_url: "https://api.openai.com/v1"

evaluator:

  # Python class path of the evaluator (module path or file_path:ClassName)
  class_path: "path/to/evaluator.py:YourEvaluator"

  # Keyword arguments passed to the evaluator constructor
  kwargs: {}

logger:

  # Python class path of the Pickle logger
  class_path: "algodisco.providers.logger.pickle_logger.BasePickleLogger"
  kwargs:
    # Directory for storing pickle log files; each item type gets its own subdirectory
    logdir: "logs/funsearch_log"
