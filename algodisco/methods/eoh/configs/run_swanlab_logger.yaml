method:

  # Path to the template algorithm source code file, read at runtime as the seed algorithm
  template_program_path: "path/to/template.txt"

  # Path to a natural-language task description file, injected into every LLM prompt
  task_description_path: "path/to/task_description.txt"

  # Programming language of generated algorithms, used to extract code blocks from LLM responses
  language: "python"

  # Target population size maintained by the database; "auto" resolves to clamp(max_samples // 100, 5, 64)
  pop_size: 10

  # Number of parents selected from the population for multi-parent operators (e.g., crossover)
  selection_num: 2

  # Whether to enable the e2 crossover operator (crossover of two parents)
  use_e2_operator: true

  # Whether to enable the m1 mutation operator (single-point mutation of one parent)
  use_m1_operator: true

  # Whether to enable the m2 mutation operator (different mutation strategy from m1)
  use_m2_operator: true

  # Number of concurrent sampler threads; "auto" resolves to max(1, cpu_count // 2)
  num_samplers: auto

  # Max concurrent evaluator calls; "auto" resolves to max(1, cpu_count // 4), gated by semaphore
  num_evaluators: auto

  # Total number of evaluated candidate samples before the search terminates
  max_samples: 1000

  # Maximum number of tokens the LLM generates in a single response
  llm_max_tokens: null

  # Timeout in seconds for each LLM API call
  llm_timeout_seconds: 120

  # Save a full database snapshot every this many evaluated samples
  db_save_frequency: 100

  # Multiplier controlling initialization-phase sample count; i1 operator used when samples < pop_size * this value
  init_samples_ratio: 2.0

  # Allowlist of metadata keys retained on each algorithm before serialization for logging
  keep_metadata_keys: ["idea", "sample_time", "eval_time", "execution_time", "error_msg", "prompt", "response_text"]

  # Debug mode: when true, sampler thread errors are logged at ERROR level
  debug_mode: false

  # Debug crash mode (requires debug_mode=true): any sampler error terminates the search immediately
  debug_mode_crash: false

llm:

  # Python class path of the LLM provider
  class_path: "algodisco.providers.llm.openai_api.OpenAIAPI"
  kwargs:
    # Model name to use
    model: "gpt-3.5-turbo"

    # API key for authentication
    api_key: "your-api-key"

    # Base URL of the API endpoint
    base_url: "https://api.openai.com/v1"

evaluator:

  # Python class path of the evaluator (module path or file_path:ClassName)
  class_path: "path/to/evaluator.py:YourEvaluator"

  # Keyword arguments passed to the evaluator constructor
  kwargs: {}

logger:

  # Python class path of the SwanLab logger, extends Pickle logger with SwanLab experiment tracking
  class_path: "algodisco.providers.logger.swanlab_logger.BaseSwanLabLogger"
  kwargs:
    # Directory for storing pickle log files
    logdir: "logs/eoh_log"

    # SwanLab project name
    project: "your-swanlab-project"

    # Name for this specific experiment run
    experiment_name: "eoh-run"

    # Group name for organizing related runs
    group: "eoh"

    # Separate directory for SwanLab's own log files; falls back to logdir if not set
    swanlab_logdir: "logs/eoh_log/swanlab"

    # SwanLab API key; when null, uses the SWANLAB_API_KEY environment variable
    api_key: null
