method:

  # Path to the template algorithm source code file, read at runtime as the seed algorithm
  template_program_path: "path/to/template.txt"

  # Path to a natural-language task description file, injected into every LLM prompt
  task_description_path: "path/to/task_description.txt"

  # Programming language of generated algorithms, used to extract code blocks from LLM responses
  language: "python"

  # Target population size maintained by the database; "auto" resolves based on max_samples thresholds
  pop_size: 10

  # Number of accepted solutions before transitioning from initialization to main search phase
  init_pop_size: 10

  # Number of niches/clusters maintained during the clustered search phase; "auto" resolves based on pop_size
  num_clusters: 3

  # Number of accepted clustered candidates after which the global population is re-clustered
  cluster_refresh_interval: 5

  # Hard cap multiplier for initialization attempts; effective budget = init_trial_multiplier * init_pop_size
  init_trial_multiplier: 10

  # Whether high-performing clusters receive more search traffic via softmax-weighted selection
  use_resource_tilt: false

  # Softmax temperature scale for resource tilt; higher values concentrate allocation on best clusters
  resource_tilt_alpha: 2.0

  # Relative frequency of the reflection-based (re) operator: LLM critiques the parent first
  re_operator_weight: 1

  # Relative frequency of the summary-guided (se) operator: uses archive summary to steer generation
  se_operator_weight: 1

  # Relative frequency of the cross-niche crossover (cn) operator: combines parents from different clusters
  cn_operator_weight: 1

  # Relative frequency of the local-global evolution (lge) operator: combines local and global context
  lge_operator_weight: 1

  # Number of top archive entries retained as elites (best-performing across all clusters)
  archive_elite_size: 5

  # Number of high-quality non-elites retained as hard negatives for challenging prompt examples
  archive_hard_negative_size: 30

  # Number of SE requests between archive-summary refresh opportunities; "auto" resolves to max(3, num_clusters * 3)
  summary_update_interval: 9

  # Number of concurrent sampler threads
  num_samplers: 1

  # Max concurrent evaluator calls; "auto" resolves to max(1, cpu_count // 4), gated by semaphore
  num_evaluators: auto

  # Total number of evaluated candidate samples before the search terminates
  max_samples: 1000

  # Maximum number of tokens the LLM generates in a single response
  llm_max_tokens: null

  # Timeout in seconds for each LLM API call
  llm_timeout_seconds: 120

  # Save a full database snapshot every this many evaluated samples
  db_save_frequency: 100

  # Allowlist of metadata keys retained on each algorithm before serialization for logging
  keep_metadata_keys: ["idea", "phase", "cluster_id", "reflection_guidance", "archive_summary", "sample_time", "eval_time", "execution_time", "error_msg", "prompt", "response_text"]

  # Debug mode: when true, sampler thread errors are logged at ERROR level
  debug_mode: false

  # Debug crash mode (requires debug_mode=true): any sampler error terminates the search immediately
  debug_mode_crash: false

llm:

  # Python class path of the LLM provider
  class_path: "algodisco.providers.llm.openai_api.OpenAIAPI"
  kwargs:
    # Model name to use
    model: "gpt-3.5-turbo"

    # API key for authentication
    api_key: "your-api-key"

    # Base URL of the API endpoint
    base_url: "https://api.openai.com/v1"

evaluator:

  # Python class path of the evaluator (module path or file_path:ClassName)
  class_path: "path/to/evaluator.py:YourEvaluator"

  # Keyword arguments passed to the evaluator constructor
  kwargs: {}

logger:

  # Python class path of the SwanLab logger, extends Pickle logger with SwanLab experiment tracking
  class_path: "algodisco.providers.logger.swanlab_logger.SwanLabLogger"
  kwargs:
    # Directory for storing pickle log files
    logdir: "logs/partevo_log"

    # SwanLab project name
    project_name: "algodisco"

    # Name for this specific experiment run
    experiment_name: "partevo-run"

    # Group name for organizing related runs
    group: "partevo"

    # Separate directory for SwanLab's own log files; falls back to logdir if not set
    swanlab_logdir: "logs/partevo_log/swanlab"
